spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: 'email  do remtente'
    password: 'senha do aplicativo'
    protocol: smtp
    properties:
      mail:
        smtp:
          socketFactory:
            port: 465
            class: javax.net.ssl.SSLSocketFactory
            fallBack: false
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout:
          writetimeout: 5000

  thymeleaf:
    enable: true

